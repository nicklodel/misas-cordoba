<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Horario de Misas en Córdoba" />
  <title>Misas Córdoba</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50:'#fdf6ee',100:'#fae9d4',200:'#f5d1a3',300:'#efb36a',
              400:'#e8903a',500:'#e2731e',600:'#d45a14',700:'#b04212',
              800:'#8c3416',900:'#722d15',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background:#f5f5f4; }
    .chip { display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:9999px;font-size:.8rem;font-weight:500;cursor:pointer;transition:all .15s;user-select:none;border:none; }
    .chip-active { background:#8c3416;color:white; }
    .chip-inactive { background:white;color:#57534e;border:1px solid #e7e5e4; }
    .chip-inactive:hover { border-color:#efb36a;color:#8c3416; }
.time-pill { display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;background:#fdf6ee;color:#7c2d12;font-size:.8rem;font-weight:600;border:1px solid #fae9d4; }
    .zone-badge { display:inline-block;padding:2px 8px;border-radius:9999px;font-size:.7rem;font-weight:600; }
details > summary { list-style:none; }
    details > summary::-webkit-details-marker { display:none; }
    input[type=search]::-webkit-search-cancel-button { display:none; }
    .card { background:white;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid #f5f5f4;overflow:hidden; }
    .map-btn { display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:6px;font-size:.75rem;font-weight:500;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;cursor:pointer;text-decoration:none;transition:background .15s; }
    .map-btn:hover { background:#dbeafe; }
  </style>
</head>
<body class="min-h-screen">

<div id="app">

  <!-- HEADER -->
  <header class="bg-primary-800 text-white shadow-lg">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center gap-3">
      <div class="flex-shrink-0 bg-primary-700 rounded-full p-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path d="M12 2v20M2 12h20" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-tight">Misas Córdoba</h1>
        <p id="result-count" class="text-primary-200 text-xs mt-0.5">Cargando…</p>
      </div>
    </div>
  </header>

  <!-- STICKY FILTERS -->
  <div class="bg-white border-b border-stone-200 shadow-sm sticky top-0 z-10">
    <div class="max-w-3xl mx-auto px-4 py-3 space-y-3">

      <!-- Search -->
      <div class="relative">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-stone-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="search" type="search" placeholder="Buscar iglesia o parroquia…"
          class="w-full pl-9 pr-4 py-2 rounded-lg border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary-300 bg-stone-50" />
      </div>

      <!-- Time of day -->
      <div>
        <p class="text-xs font-semibold text-stone-400 uppercase tracking-wide mb-1.5">Horario</p>
        <div id="time-filters" class="flex gap-1.5 flex-wrap">
          <button class="chip chip-active" data-time="all">Cualquier hora</button>
          <button class="chip chip-inactive" data-time="morning">Mañana <span class="opacity-60">6–12h</span></button>
          <button class="chip chip-inactive" data-time="midday">Mediodía <span class="opacity-60">12–14h</span></button>
          <button class="chip chip-inactive" data-time="afternoon">Tarde <span class="opacity-60">14–19h</span></button>
          <button class="chip chip-inactive" data-time="evening">Noche <span class="opacity-60">19h+</span></button>
        </div>
      </div>

      <!-- Zones -->
      <div>
        <div class="flex justify-between items-center mb-1.5">
          <p class="text-xs font-semibold text-stone-400 uppercase tracking-wide">Zona</p>
          <button id="clear-zones" class="text-xs text-primary-600 hover:text-primary-800 hidden">Limpiar</button>
        </div>
        <div id="zone-filters" class="flex gap-1.5 flex-wrap"></div>
      </div>

      <!-- Day type -->
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <p class="text-xs font-semibold text-stone-400 uppercase tracking-wide">Tipo de día</p>
          <span id="season-badge" class="text-xs px-2 py-0.5 rounded-full font-medium"></span>
        </div>
        <div id="day-filters" class="flex gap-1.5 flex-wrap"></div>
      </div>

    </div>
  </div>

  <!-- RESULTS -->
  <main class="max-w-3xl mx-auto px-4 py-4">
    <div id="results" class="space-y-3">
      <p class="text-center text-stone-400 py-12 text-sm">Cargando horarios…</p>
    </div>
  </main>

  <footer class="text-center text-xs text-stone-400 py-4 border-t border-stone-200 mt-4">
    Horarios de Misas · Diócesis de Córdoba
  </footer>
</div>

<script>
// ─── SEASON LOGIC ─────────────────────────────────────────────────────────────
const CURRENT_MONTH = new Date().getMonth() + 1;
const TODAY_DOW     = new Date().getDay();

function getCurrentTemporada() {
  return (CURRENT_MONTH >= 6 && CURRENT_MONTH <= 9) ? 'Verano' : 'Invierno';
}
const CURRENT_TEMPORADA = getCurrentTemporada();
// Updated after data loads to reflect what's actually shown (may differ from calendar season)
let DISPLAYED_TEMPORADA = CURRENT_TEMPORADA;

const TEMPORADA_STYLE = {
  Verano:   { badge: 'bg-amber-100 text-amber-700',  icon: '☀️' },
  Invierno: { badge: 'bg-blue-100 text-blue-700',    icon: '❄️' },
};

// ─── ZONE CONFIG ─────────────────────────────────────────────────────────────
const ZONE_SHORT = {
  "ZONA CATEDRAL CASCO HISTÓRICO":              "Catedral",
  "ZONA CENTRO":                                "Centro",
  "ZONA SIERRA":                                "Sierra",
  "ZONA CIUDAD JARDÍN – PARQUE CRUZ CONDE":     "C. Jardín",
  "ZONA SECTOR SUR":                            "Sector Sur",
  "ZONA NOROESTE":                              "Noroeste",
  "ZONA LEVANTE":                               "Levante",
  "ZONA FUENSANTA – CAÑERO – LEVANTE SUR":      "Fuensanta",
};
const ZONE_COLOR = {
  "ZONA CATEDRAL CASCO HISTÓRICO":              "bg-amber-100 text-amber-800",
  "ZONA CENTRO":                                "bg-blue-100 text-blue-800",
  "ZONA SIERRA":                                "bg-green-100 text-green-800",
  "ZONA CIUDAD JARDÍN – PARQUE CRUZ CONDE":     "bg-teal-100 text-teal-800",
  "ZONA SECTOR SUR":                            "bg-purple-100 text-purple-800",
  "ZONA NOROESTE":                              "bg-rose-100 text-rose-800",
  "ZONA LEVANTE":                               "bg-orange-100 text-orange-800",
  "ZONA FUENSANTA – CAÑERO – LEVANTE SUR":      "bg-cyan-100 text-cyan-800",
};

// ─── ADDRESS HELPER ───────────────────────────────────────────────────────────
/** Returns the first 1–2 meaningful parts of an OSM address string */
function shortAddress(address) {
  if (!address) return null;
  const parts = address.split(',').map(s => s.trim());
  const skip = new Set(['España', 'Andalucía', 'Provincia de Córdoba', 'Córdoba']);
  const useful = parts.filter(p => !skip.has(p) && !/^\d{5}$/.test(p));
  return useful.slice(0, 2).join(', ') || null;
}

// ─── TIME HELPERS ─────────────────────────────────────────────────────────────
function extractTimes(raw) {
  if (!raw || /cerrada?\s+temporalmente/i.test(raw)) return [];
  const re = /\b(\d{1,2}):(\d{2})\b/g;
  const out = []; const seen = new Set(); let m;
  while ((m = re.exec(raw)) !== null) {
    const t = m[1].padStart(2,'0')+':'+m[2];
    if (!seen.has(t)) { seen.add(t); out.push({ h: parseInt(m[1]), time: t }); }
  }
  return out;
}
function isClosed(raw) { return /cerrada?\s+temporalmente/i.test(raw||''); }
function isNoMass(raw) { return !raw || raw.trim() === ''; }
function matchesTime(times, tod) {
  if (tod === 'all') return true;
  return times.some(t => {
    if (tod === 'morning')   return t.h >= 6  && t.h < 12;
    if (tod === 'midday')    return t.h >= 12 && t.h < 14;
    if (tod === 'afternoon') return t.h >= 14 && t.h < 19;
    if (tod === 'evening')   return t.h >= 19;
    return true;
  });
}

// ─── MAPS URL ─────────────────────────────────────────────────────────────────
function mapsUrl(church) {
  const q = encodeURIComponent(`${church.parroquia_iglesia}, Córdoba, España`);
  return `https://www.google.com/maps/search/?api=1&query=${q}`;
}

// ─── STATE ────────────────────────────────────────────────────────────────────
let CHURCHES = [];
let ZONES    = [];

const state = {
  dayType:   TODAY_DOW === 0 ? 'sunday' : TODAY_DOW === 6 ? 'saturday' : 'weekday',
  timeOfDay: 'all',
  zones:     new Set(),
  search:    '',
};

function getRaw(c) {
  return state.dayType === 'weekday' ? c.dias_laborables
       : state.dayType === 'saturday' ? c.sabados_visperas_festivos
       : c.domingos_festivos;
}


// ─── RENDER ───────────────────────────────────────────────────────────────────
function buildZoneFilters() {
  const el = document.getElementById('zone-filters');
  el.innerHTML = '';
  ZONES.forEach(zone => {
    const btn = document.createElement('button');
    btn.className = 'chip ' + (state.zones.has(zone) ? 'chip-active' : 'chip-inactive');
    btn.textContent = ZONE_SHORT[zone] || zone;
    btn.onclick = () => {
      state.zones.has(zone) ? state.zones.delete(zone) : state.zones.add(zone);
      document.getElementById('clear-zones').classList.toggle('hidden', state.zones.size === 0);
      render();
    };
    el.appendChild(btn);
  });
}

function buildDayFilters() {
  const el = document.getElementById('day-filters');
  el.innerHTML = '';
  const todayType = TODAY_DOW === 0 ? 'sunday' : TODAY_DOW === 6 ? 'saturday' : 'weekday';
  [
    { v:'weekday',  l:'Laborable' },
    { v:'saturday', l:'Sábado' },
    { v:'sunday',   l:'Domingo' },
  ].forEach(({ v, l }) => {
    const btn = document.createElement('button');
    btn.className = 'chip ' + (state.dayType === v ? 'chip-active' : 'chip-inactive');
    btn.innerHTML = l + (v === todayType ? ` <span class="opacity-70 text-xs">hoy</span>` : '');
    btn.onclick = () => { state.dayType = v; render(); };
    el.appendChild(btn);
  });
}

function render() {
  document.querySelectorAll('#time-filters button').forEach(btn => {
    btn.className = 'chip ' + (state.timeOfDay === btn.dataset.time ? 'chip-active' : 'chip-inactive');
  });

  const style = TEMPORADA_STYLE[DISPLAYED_TEMPORADA] || TEMPORADA_STYLE.Invierno;
  const badge = document.getElementById('season-badge');
  badge.className = `text-xs px-2 py-0.5 rounded-full font-medium ${style.badge}`;
  badge.textContent = `${style.icon} ${DISPLAYED_TEMPORADA}`;

  buildZoneFilters();
  buildDayFilters();

  // Filter
  let results = CHURCHES.filter(c => {
    if (state.zones.size > 0 && !state.zones.has(c.zona)) return false;
    if (state.search && !c.parroquia_iglesia.toLowerCase().includes(state.search.toLowerCase())) return false;
    const raw = getRaw(c);
    if (isClosed(raw) || isNoMass(raw)) return state.timeOfDay === 'all';
    return matchesTime(extractTimes(raw), state.timeOfDay);
  });

  // Count
  document.getElementById('result-count').textContent =
    results.length === CHURCHES.length
      ? `${CHURCHES.length} iglesias · ${DISPLAYED_TEMPORADA}`
      : `${results.length} de ${CHURCHES.length} resultados`;

  const container = document.getElementById('results');
  container.innerHTML = '';

  if (results.length === 0) {
    container.innerHTML = `<div class="text-center py-16 text-stone-400"><p class="text-lg font-medium">Sin resultados</p><p class="text-sm mt-1">Prueba a cambiar los filtros</p></div>`;
    return;
  }

  results.forEach(c => {
    const raw    = getRaw(c);
    const closed = isClosed(raw);
    const noMass = isNoMass(raw);
    const times  = extractTimes(raw);
    const zColor = ZONE_COLOR[c.zona] || 'bg-stone-100 text-stone-700';
    const zShort = ZONE_SHORT[c.zona] || c.zona;
    const addr   = shortAddress(c.address);

    const timesHtml = closed
      ? `<span class="text-xs text-red-600 font-medium">⚠ Cerrada temporalmente</span>`
      : noMass
      ? `<span class="text-xs text-stone-400 italic">Sin misa este día</span>`
      : times.length === 0
      ? `<span class="text-xs text-stone-400 italic">Ver horario completo</span>`
      : times.map(t => `<span class="time-pill">🕐 ${t.time}</span>`).join('');

    const allSchedule = [
      { k:'dias_laborables',           l:'Laborables' },
      { k:'sabados_visperas_festivos',  l:'Sábados/Vísperas' },
      { k:'domingos_festivos',          l:'Domingos/Festivos' },
    ].map(({ k, l }) => {
      const r    = c[k];
      const nota = c[`notas_${k}`];
      const v    = isClosed(r) ? 'Cerrada temporalmente' : isNoMass(r) ? '–' : r;
      const notaHtml = nota ? ` <span class="text-stone-400 italic">(${nota})</span>` : '';
      return `<div class="text-xs"><span class="font-semibold text-stone-600">${l}: </span><span class="text-stone-500">${v}</span>${notaHtml}</div>`;
    }).join('');

    const card = document.createElement('details');
    card.className = 'card';
    card.innerHTML = `
      <summary class="px-4 py-3 flex items-start gap-3 cursor-pointer active:bg-stone-50 select-none">
        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-2">
            <h2 class="text-sm font-semibold text-stone-800 leading-snug">${c.parroquia_iglesia}</h2>
            <svg class="chevron flex-shrink-0 mt-0.5 w-4 h-4 text-stone-400 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <div class="flex items-center gap-1.5 mt-1 flex-wrap">
            <svg class="w-3 h-3 text-stone-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span class="zone-badge ${zColor}">${zShort}</span>
          </div>
          ${addr ? `<p class="mt-1 text-xs text-stone-400 leading-snug truncate">${addr}</p>` : ''}
          <div class="mt-2 flex flex-wrap gap-1.5">${timesHtml}</div>
        </div>
      </summary>
      <div class="border-t border-stone-100 px-4 py-3 bg-stone-50 space-y-3">
        <div class="flex items-center justify-between gap-2">
          <p class="text-xs font-semibold text-stone-400 uppercase tracking-wide">Horario · <span class="normal-case">${DISPLAYED_TEMPORADA}</span></p>
          <a href="${mapsUrl(c)}" target="_blank" rel="noopener noreferrer" class="map-btn flex-shrink-0" onclick="event.stopPropagation()">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            Ver en Maps
          </a>
        </div>
        ${allSchedule}
      </div>
    `;
    card.addEventListener('toggle', () => {
      card.querySelector('.chevron').style.transform = card.open ? 'rotate(180deg)' : '';
    });
    container.appendChild(card);
  });
}

// ─── LOAD DATA ────────────────────────────────────────────────────────────────
async function loadData() {
  let allRecords;
  try {
    const res = await fetch('./timetables_plus.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    allRecords = await res.json();
  } catch (e) {
    document.getElementById('results').innerHTML = `
      <div class="card p-5 text-sm text-stone-600 space-y-2">
        <p class="font-semibold text-red-600">⚠ No se pudo cargar timetables.json</p>
        <p>El navegador bloquea la carga de archivos locales cuando se abre directamente desde el explorador.</p>
        <p class="font-medium">Solución: abre la carpeta en VS Code → botón derecho en <code class="bg-stone-100 px-1 rounded">index.html</code> → <em>Open with Live Server</em>.</p>
        <p class="text-xs text-stone-400">O ejecuta <code class="bg-stone-100 px-1 rounded">python -m http.server 8080</code> en esta carpeta.</p>
      </div>`;
    document.getElementById('result-count').textContent = 'Error al cargar';
    return;
  }

  let records = allRecords.filter(r => r.temporada === CURRENT_TEMPORADA);
  if (records.length === 0) {
    records = allRecords;
    DISPLAYED_TEMPORADA = allRecords[0]?.temporada || CURRENT_TEMPORADA;
  }

  CHURCHES = records;
  ZONES    = [...new Set(records.map(r => r.zona))];

  document.getElementById('search').addEventListener('input', e => { state.search = e.target.value; render(); });
  document.querySelectorAll('#time-filters button').forEach(btn => {
    btn.addEventListener('click', () => { state.timeOfDay = btn.dataset.time; render(); });
  });
  document.getElementById('clear-zones').addEventListener('click', () => {
    state.zones.clear();
    document.getElementById('clear-zones').classList.add('hidden');
    render();
  });

  render();
}

loadData();
</script>
</body>
</html>
